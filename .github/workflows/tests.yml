name: tests

# 每次推送到 master、以及每个 PR，都把这 310 条测试从头跑一遍。
#
# 为什么值得单独建这个文件：测试写了三百多条，但在这之前**没有任何人看得见它们跑没跑**
# ——只有我在本地手动敲命令。加了这一步之后，「改坏了」会在推送时当场变红，而不是
# 等读者在页面上撞见。
#
# 为什么用 Python 3.13 而不是服务器那套 3.10：requirements.txt 钉的是
# scikit-learn 1.8.0 与 scipy 1.16.3，这两个包自己声明的 requires-python 都是 >=3.11，
# **在 3.10 上根本装不上**。也就是说服务器现在跑的那套依赖，按 requirements.txt 是复现
# 不出来的（见 README 顶部「已知的口径不一致」）。这里先按「钉死的版本能装上的最高一档」
# 跑，等服务器那套依赖对齐之后再把 3.10/3.12 加进矩阵。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备 NLTK 数据（punkt / punkt_tab / stopwords）
        # 这三份数据不在 requirements.txt 里（它只列 pip 包）。缺了 punkt 会在
        # 分词那一步抛 LookupError——pipeline._ensure_nltk_data() 只负责「缺了才试着下」，
        # 不负责保证下得到，所以这里显式装好，别让测试结果取决于网络当时通不通。
        run: python -m nltk.downloader punkt punkt_tab stopwords

      - name: 跑测试
        run: python -m unittest discover -s tests -v
